{% extends "base.html" %}

{% block title %}Recuperar acesso — Forma Flow{% endblock %}

{% block content %}
  <section class="auth-layout auth-layout-single" aria-labelledby="titulo-pagina">
    <div class="auth-card">
      <p class="eyebrow">Recuperação</p>
      <h1 id="titulo-pagina" class="page-title">Recuperar acesso</h1>
      <p class="section-copy">Introduza o seu email. A resposta será igual, esteja ou não registado.</p>
      <form method="post" class="stacked-form" novalidate>
        {% csrf_token %}
        {% include "includes/formulario.html" %}
        <button class="button button-primary" type="submit">Enviar instruções</button>
      </form>
    </div>
  </section>
{% endblock %}
