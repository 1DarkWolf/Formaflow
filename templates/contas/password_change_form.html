{% extends "base.html" %}

{% block title %}Alterar palavra-passe — Forma Flow{% endblock %}

{% block content %}
  <section class="auth-layout auth-layout-single" aria-labelledby="titulo-pagina">
    <div class="auth-card">
      <p class="eyebrow">Segurança</p>
      <h1 id="titulo-pagina" class="page-title">Alterar palavra-passe</h1>
      <form method="post" class="stacked-form" novalidate>
        {% csrf_token %}
        {% include "includes/formulario.html" %}
        <button class="button button-primary" type="submit">Guardar alteração</button>
      </form>
    </div>
  </section>
{% endblock %}
