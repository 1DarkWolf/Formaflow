services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-formaflow}
      POSTGRES_USER: ${POSTGRES_USER:-formaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formaflow} -d ${POSTGRES_DB:-formaflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no ficheiro .env}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "false"
      DJANGO_SECURE_HSTS_PRELOAD: "false"
      POSTGRES_DB: ${POSTGRES_DB:-formaflow}
      POSTGRES_USER: ${POSTGRES_USER:-formaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Defina DATA_ENCRYPTION_KEY no ficheiro .env}
      DATA_HASH_KEY: ${DATA_HASH_KEY:?Defina DATA_HASH_KEY no ficheiro .env}
      FORMAFLOW_DEMO_PASSWORD: ${FORMAFLOW_DEMO_PASSWORD:?Defina FORMAFLOW_DEMO_PASSWORD no ficheiro .env}
      PRIVATE_UPLOAD_ROOT: /data/private_uploads
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - private_uploads:/data/private_uploads
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  private_uploads:
