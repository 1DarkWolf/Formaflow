name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: formaflow
          POSTGRES_USER: formaflow
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formaflow -d formaflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_TEST_DATABASE_ENGINE: postgresql
      DJANGO_SECRET_KEY: test-only-secret-key
      POSTGRES_DB: formaflow
      POSTGRES_USER: formaflow
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            requirements/development.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements/development.txt

      - name: Verificar formatação
        run: python -m ruff format --check .

      - name: Executar análise estática
        run: python -m ruff check .

      - name: Verificar configuração
        run: python manage.py check

      - name: Verificar migrações esquecidas
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes com cobertura
        run: python -m coverage run manage.py test --settings=config.settings.test

      - name: Apresentar cobertura
        run: python -m coverage report
